<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recording the Sounds</title>
<style>
  html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 600 16px system-ui, sans-serif;
         text-align: center; padding: 20px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="msg">Loading the game&hellip;</div>
<script>
/* The port builder's sound recording: the parent page sends {type: 'bbro-record', rom};
 * this page runs the browser runtime with --make-sounds, which plays every song, effect
 * and voice through the game's own sound driver and chips and keeps them losslessly
 * (sounds.bbs), then sends {type: 'bbro-sounds', ok, data} back. The single-file builder
 * also sends the runtime (runtime: the .js with the wasm inside). Opened from disk, it uses
 * the single-file runtime (browsers do not load a separate .wasm file from disk). */
(() => {
  const canvas = document.getElementById('canvas'), msg = document.getElementById('msg');
  let started = false;
  const reply = (ok, data, error) =>
    parent.postMessage({ type: 'bbro-sounds', ok, data, error }, '*', data ? [data] : []);
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'bbro-record' || started) return;
    started = true;
    const tryLoad = list => {
      const src = list.shift();
      if (!src) {
        msg.textContent = 'The game runtime (web/bonanza.js) was not found next to the builder.';
        reply(false, null, 'runtime not found');
        return;
      }
      window.Module = {
        canvas,
        locateFile: p => src.replace(/[^/]*$/, '') + p,
        print: t => console.log(t),
        printErr: t => console.warn(t),
        bonanzaSoundsMade(path, ok) {
          try {
            if (!ok) throw new Error('the recording could not be written');
            const bytes = Module.FS.readFile(path);
            reply(true, bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
          } catch (err) {
            reply(false, null, String(err.message || err));
          }
        },
        onRuntimeInitialized() {
          Module.FS.writeFile('/baserom.md', d.rom);
          msg.style.display = 'none';
          Module.callMain(['--make-sounds', '/sounds.bbs']);
        },
      };
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => { s.remove(); tryLoad(list); };
      document.body.appendChild(s);
    };
    if (d.runtime)                     /* the single-file builder sends the runtime itself */
      tryLoad([URL.createObjectURL(new Blob([d.runtime], { type: 'text/javascript' }))]);
    else
      tryLoad(location.protocol === 'file:' ? ['web/bonanza-single.js'] : ['web/bonanza.js', 'web/bonanza-single.js']);
  });
  parent.postMessage({ type: 'bbro-record-ready' }, '*');
})();
</script>
</body>
</html>
