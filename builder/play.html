<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 600 18px system-ui, sans-serif;
         text-align: center; padding: 20px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="msg">Loading the game&hellip;</div>
<script>
/* Test play for the level maker: the parent page sends
 * {type: 'bbro-play', rom, mod, entry, ini}; this page runs the browser runtime with the
 * mod turned on, straight into that stage (--play-stage). Opened from disk, it uses the
 * single-file runtime (browsers do not load a separate .wasm file from disk). */
(() => {
  const canvas = document.getElementById('canvas'), msg = document.getElementById('msg');
  let started = false;
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'bbro-play' || started) return;
    started = true;
    const tryLoad = list => {
      const src = list.shift();
      if (!src) {
        msg.textContent = 'The game runtime (web/bonanza-single.js) was not found next to the level maker.';
        parent.postMessage({ type: 'bbro-play-error' }, '*');
        return;
      }
      window.Module = {
        canvas,
        locateFile: p => src.replace(/[^/]*$/, '') + p,
        print: t => console.log(t),
        printErr: t => console.warn(t),
        onRuntimeInitialized() {
          const FS = Module.FS;
          FS.writeFile('/baserom.md', d.rom);
          FS.writeFile('/bonanza.ini', d.ini);
          try { FS.mkdir('/mods'); } catch (err) { /* there */ }
          FS.writeFile('/mods/test.bbro', d.mod);
          msg.style.display = 'none';
          Module.callMain(['--play-stage', String(d.entry)]);
          canvas.focus();
          parent.postMessage({ type: 'bbro-play-started' }, '*');
        },
      };
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => { s.remove(); tryLoad(list); };
      document.body.appendChild(s);
    };
    tryLoad(location.protocol === 'file:' ? ['web/bonanza-single.js'] : ['web/bonanza.js', 'web/bonanza-single.js']);
  });
  canvas.addEventListener('click', () => canvas.focus());
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  }, { passive: false });
  window.addEventListener('focus', () => canvas.focus());
  parent.postMessage({ type: 'bbro-play-ready' }, '*');
})();
</script>
</body>
</html>
