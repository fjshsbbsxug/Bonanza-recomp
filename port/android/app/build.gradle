apply plugin: 'com.android.application'

android {
    namespace "com.bonanzarecomp.port"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "com.bonanzarecomp.port"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DBONANZA_HEADLESS=OFF"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs as-is; use your own key for distribution.
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
}
