apply plugin: 'com.android.application'

android {
    namespace "com.bonanzarecomp.port"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "com.bonanzarecomp.port"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DBONANZA_HEADLESS=OFF", "-DBONANZA_GAME_LIB=ON"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Not signed here: the builder page adds the game's code (made from the player's
            // ROM) and signs the app in the browser (builder/apk.js, APK Signature Scheme v2).
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
    packagingOptions {
        jniLibs {
            // the game's code (libbonanza_game.so) is added to the APK by the builder page:
            // native libraries compressed and extracted when installed
            useLegacyPackaging true
        }
    }
}
