name: Port

# Builds the native port's engines (Linux, Windows, Android) and the three builder pages.
# The pages also record the game's sounds from the ROM (the game's recorder as WebAssembly).
# No ROM is involved and nothing of the game is built here: the engines hold no game
# code, and a builder page makes it from the player's ROM in the browser (the project's
# recompiler in Pyodide, TinyCC as WebAssembly), then gives the player the finished
# package (port/dist/package.py, builder/gamecode.js).
#
# The pages are uploaded as the "BonanzaBuilders" artifact and, on pushes, published on
# the Releases page (release "builder").

on:
  push:
    paths:
      - "port/**"
      - "builder/**"
      - "tools/**"
      - ".github/workflows/port.yml"
  pull_request:
    paths:
      - "port/**"
      - "builder/**"
      - "tools/**"
      - ".github/workflows/port.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_URL: https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
  PYODIDE_VERSION: 314.0.7

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libudev-dev libdecor-0-dev
      - name: Build the engine
        run: |
          cmake -S port -B build -DCMAKE_BUILD_TYPE=Release -DBONANZA_FETCH_SDL=ON -DBONANZA_SDL_URL=$SDL_URL \
                -DBONANZA_GAME_LIB=ON
          cmake --build build -j
      - name: Package
        run: python3 port/dist/package.py native --platform linux --exe build/bonanza --out out/bonanza-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bonanza-linux-x64
          path: out/bonanza-linux-x64.zip

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Build the engine
        run: |
          cmake -S port -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
                -DBONANZA_FETCH_SDL=ON -DBONANZA_SDL_URL=$SDL_URL -DBONANZA_GAME_LIB=ON
          cmake --build build -j
      - name: Package
        run: python3 port/dist/package.py native --platform windows --exe build/bonanza.exe --out out/bonanza-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bonanza-windows-x64
          path: out/bonanza-windows-x64.zip

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK, CMake and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Build the engine's APK (unsigned)
        working-directory: port/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p out
          cp port/android/app/build/outputs/apk/release/app-release-unsigned.apk out/bonanza-android.apk
      # the builder page's signing (builder/apk.js) checked by Android's own apksigner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the page's APK signing
        run: |
          node port/dist/apk_test.mjs out/bonanza-android.apk signed-test.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --min-sdk-version 24 signed-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bonanza-android
          path: out/bonanza-android.apk

  tinycc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build TinyCC (WebAssembly) for the builder pages
        run: |
          mkdir -p out/tcc
          sh port/dist/build_tcc.sh out/tcc
          rm -rf out/tcc/.tcc-src
      # the game's sound recorder for the pages (no game code in it: it plays the sound
      # driver from the player's ROM)
      - name: Build the sound recorder (WebAssembly) for the builder pages
        run: |
          emcmake cmake -S port -B build-sounds -DCMAKE_BUILD_TYPE=Release -DBONANZA_GAME_LIB=ON -DBONANZA_HEADLESS=OFF
          cmake --build build-sounds -j --target bonanza-sounds
          cp build-sounds/bonanza-sounds.js out/tcc/
      - uses: actions/upload-artifact@v4
        with:
          name: tinycc
          path: out/tcc

  builders:
    needs: [linux, windows, android, tinycc]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pyodide (Python for the page's recompiler)
        run: |
          mkdir -p pyodide
          curl -sSL "https://registry.npmjs.org/pyodide/-/pyodide-$PYODIDE_VERSION.tgz" | tar xz -C pyodide
      - name: Make the builder pages
        run: |
          V="${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))"
          python3 port/dist/package.py kit --tcc artifacts/tinycc --out out/gamekit.zip
          python3 port/dist/package.py builder --platform windows --package artifacts/bonanza-windows-x64/bonanza-windows-x64.zip \
                  --kit out/gamekit.zip --pyodide pyodide/package --recorder artifacts/tinycc/bonanza-sounds.js --version "$V" --out builders/BonanzaBuilder-Windows.html
          python3 port/dist/package.py builder --platform linux --package artifacts/bonanza-linux-x64/bonanza-linux-x64.zip \
                  --kit out/gamekit.zip --pyodide pyodide/package --recorder artifacts/tinycc/bonanza-sounds.js --version "$V" --out builders/BonanzaBuilder-Linux.html
          python3 port/dist/package.py builder --platform android --package artifacts/bonanza-android/bonanza-android.apk \
                  --kit out/gamekit.zip --pyodide pyodide/package --recorder artifacts/tinycc/bonanza-sounds.js --version "$V" --out builders/BonanzaBuilder-Android.html
      - uses: actions/upload-artifact@v4
        with:
          name: BonanzaBuilders
          path: builders

  # the three builder pages as plain downloads on the Releases page (release "builder",
  # replaced on every push)
  release:
    needs: builders
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BonanzaBuilders
          path: builders
      - name: Publish the builder pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Download the builder page for your platform (BonanzaBuilder-Windows.html, -Linux.html or -Android.html), open it in your browser, give it your Bonanza Bros. ROM and press Build. The page makes the game's code from your ROM and records its sounds (lossless; nothing of the game is in the page) and gives you the finished package. Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
          if gh release view builder >/dev/null 2>&1; then
            gh release delete-asset builder BonanzaBuilder.html -y 2>/dev/null || true
            gh release upload builder builders/*.html --clobber
            gh release edit builder --notes "$notes"
          else
            gh release create builder builders/*.html --target "$GITHUB_SHA" \
              --title "Bonanza Builders (one HTML page per platform)" --notes "$notes"
          fi
